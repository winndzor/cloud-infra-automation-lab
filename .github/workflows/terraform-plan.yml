name: Terraform lab plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-lab-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ROOT: environments/lab
  PLAN_DIR: .artifacts/plan
  PLAN_FILE: lab.tfplan

jobs:
  plan:
    name: Create immutable lab plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow accepts only refs/heads/main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Create provider cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"

      - name: Authenticate as the plan identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/github-cloud-infra-lab/providers/github-oidc
          service_account: cloud-infra-lab-plan@example-gcp-project.iam.gserviceaccount.com
          project_id: example-gcp-project
          create_credentials_file: true
          export_environment_variables: true

      - name: Initialize lab backend
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -input=false

      - name: Validate lab
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate -no-color

      - name: Create saved plan
        run: |
          mkdir -p "${PLAN_DIR}"
          terraform -chdir="${TF_ROOT}" plan \
            -input=false \
            -lock-timeout=5m \
            -out="${GITHUB_WORKSPACE}/${PLAN_DIR}/${PLAN_FILE}"
          terraform -chdir="${TF_ROOT}" show -no-color \
            "${GITHUB_WORKSPACE}/${PLAN_DIR}/${PLAN_FILE}" \
            > "${PLAN_DIR}/plan.txt"

      - name: Build plan manifest
        id: manifest
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          plan_sha256="$(sha256sum "${PLAN_DIR}/${PLAN_FILE}" | awk '{print $1}')"
          plan_text_sha256="$(sha256sum "${PLAN_DIR}/plan.txt" | awk '{print $1}')"
          artifact_name="terraform-lab-plan-${SOURCE_RUN_ATTEMPT}"

          jq -n \
            --argjson schema_version 1 \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit_sha "${SOURCE_COMMIT}" \
            --arg source_run_id "${SOURCE_RUN_ID}" \
            --arg source_run_attempt "${SOURCE_RUN_ATTEMPT}" \
            --arg source_workflow_ref "${SOURCE_WORKFLOW_REF}" \
            --arg artifact_name "${artifact_name}" \
            --arg plan_file "${PLAN_FILE}" \
            --arg plan_sha256 "${plan_sha256}" \
            --arg plan_text_sha256 "${plan_text_sha256}" \
            '{
              schema_version: $schema_version,
              repository: $repository,
              commit_sha: $commit_sha,
              source_run_id: $source_run_id,
              source_run_attempt: $source_run_attempt,
              source_workflow_ref: $source_workflow_ref,
              artifact_name: $artifact_name,
              plan_file: $plan_file,
              plan_sha256: $plan_sha256,
              plan_text_sha256: $plan_text_sha256
            }' > "${PLAN_DIR}/manifest.json"

          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable plan bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: ${{ env.PLAN_DIR }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish review summary
        env:
          PLAN_SHA256: ${{ steps.manifest.outputs.plan_sha256 }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo "## Terraform lab plan"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Source run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Saved-plan SHA-256: \`${PLAN_SHA256}\`"
            echo "- GitHub artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo
            echo "Dispatch **Terraform lab apply** with the source run ID and saved-plan SHA-256 above."
            echo
            echo "<details><summary>Rendered plan</summary>"
            echo
            echo '```text'
            cat "${PLAN_DIR}/plan.txt"
            echo '```'
            echo "</details>"
          } >> "${GITHUB_STEP_SUMMARY}"
