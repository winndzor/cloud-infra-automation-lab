name: Promote synthetic worker image

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful container-build workflow run ID
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest published by that build
        required: true
        type: string

permissions: {}

concurrency:
  group: synthetic-worker-promotion
  cancel-in-progress: false

env:
  REGISTRY_HOST: europe-central2-docker.pkg.dev
  IMAGE_URI: europe-central2-docker.pkg.dev/example-gcp-project/cloud-infra-lab/event-metadata-worker
  BUILD_MANIFEST_NAME: worker-build-manifest.json
  RELEASE_FILE: environments/lab/worker-release.json
  SERVICE_DIR: services/event-metadata-worker

jobs:
  verify:
    name: Verify immutable image and build evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      artifact_digest: ${{ steps.source.outputs.artifact_digest }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      image_ref: ${{ steps.verified.outputs.image_ref }}
      dockerfile_sha256: ${{ steps.source_hashes.outputs.dockerfile_sha256 }}
      service_tree: ${{ steps.source_hashes.outputs.service_tree }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_run_attempt: ${{ steps.source.outputs.source_run_attempt }}

    steps:
      - name: Require owner dispatch from main
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::This workflow accepts only refs/heads/main."
            exit 1
          fi
          if [[ ! "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::source_run_id must be a positive integer."
            exit 1
          fi
          if [[ ! "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image_digest must be an exact lowercase SHA-256."
            exit 1
          fi
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            | jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg commit_sha "${GITHUB_SHA}" \
              '
                .repository.full_name == $repository and
                .path == ".github/workflows/container-promote.yml" and
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .head_sha == $commit_sha and
                .triggering_actor.id == 38678897
              ' >/dev/null

      - name: Check out trusted promotion code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful source build and artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          run_file="${RUNNER_TEMP}/source-run.json"
          artifacts_file="${RUNNER_TEMP}/source-artifacts.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            > "${run_file}"

          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            '
              .repository.full_name == $repository and
              .path == ".github/workflows/container-build.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .status == "completed" and
              .conclusion == "success" and
              .triggering_actor.id == 38678897
            ' "${run_file}" >/dev/null

          source_commit="$(jq -r '.head_sha' "${run_file}")"
          source_run_attempt="$(jq -r '.run_attempt | tostring' "${run_file}")"
          gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${source_commit}...${GITHUB_SHA}" \
            | jq -e '.status == "ahead" or .status == "identical"' >/dev/null

          artifact_name="synthetic-worker-build-${source_run_attempt}"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
            | jq -s '{artifacts: map(.artifacts) | add}' \
            > "${artifacts_file}"

          artifact_count="$(
            jq \
              --arg name "${artifact_name}" \
              '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
              "${artifacts_file}"
          )"
          if [[ "${artifact_count}" != "1" ]]; then
            echo "::error::Expected exactly one unexpired ${artifact_name} artifact."
            exit 1
          fi

          artifact_digest="$(
            jq -r \
              --arg name "${artifact_name}" \
              '.artifacts[] | select(.name == $name and .expired == false) | .digest' \
              "${artifacts_file}"
          )"
          if [[ ! "${artifact_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Source artifact has no valid service-recorded digest."
            exit 1
          fi

          echo "artifact_digest=${artifact_digest}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"
          echo "source_run_attempt=${source_run_attempt}" >> "${GITHUB_OUTPUT}"

      - name: Download source build manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: ${{ runner.temp }}/source-build
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact artifact files and manifest source
        id: source_hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          artifact_dir="${RUNNER_TEMP}/source-build"
          mapfile -d '' entries < <(
            find "${artifact_dir}" -mindepth 1 -maxdepth 1 -print0
          )
          if [[ "${#entries[@]}" != "1" ]] \
            || [[ "$(basename "${entries[0]}")" != "${BUILD_MANIFEST_NAME}" ]] \
            || [[ ! -f "${entries[0]}" ]] \
            || [[ -L "${entries[0]}" ]] \
            || [[ -n "$(find "${artifact_dir}" -mindepth 2 -print -quit)" ]]; then
            echo "::error::Build artifact must contain only ${BUILD_MANIFEST_NAME}."
            exit 1
          fi

          service_tree="$(git rev-parse "${SOURCE_COMMIT}:${SERVICE_DIR}")"
          dockerfile_sha256="$(
            git show "${SOURCE_COMMIT}:${SERVICE_DIR}/Dockerfile" \
              | sha256sum \
              | cut -d ' ' -f 1
          )"
          python3 scripts/worker_release.py verify-build-manifest \
            --manifest "${entries[0]}" \
            --expected-digest "${IMAGE_DIGEST}" \
            --expected-source-commit "${SOURCE_COMMIT}" \
            --expected-run-id "${SOURCE_RUN_ID}" \
            --expected-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-service-tree "${service_tree}" \
            --expected-dockerfile-sha256 "${dockerfile_sha256}"
          echo "dockerfile_sha256=${dockerfile_sha256}" >> "${GITHUB_OUTPUT}"
          echo "service_tree=${service_tree}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate as the read-only promotion identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/123456789012/locations/global/workloadIdentityPools/github-cloud-infra-lab/providers/github-oidc
          service_account: cloud-infra-lab-promote@example-gcp-project.iam.gserviceaccount.com
          project_id: example-gcp-project
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Log in read-only to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "${ACCESS_TOKEN}" \
            | docker login \
              --username oauth2accesstoken \
              --password-stdin \
              "https://${REGISTRY_HOST}"

      - name: Verify image platform and attached evidence
        id: verified
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          image_ref="${IMAGE_URI}@${IMAGE_DIGEST}"
          index_file="${RUNNER_TEMP}/image-index.json"
          sbom_raw="${RUNNER_TEMP}/sbom.raw.json"
          provenance_raw="${RUNNER_TEMP}/provenance.raw.json"
          sbom_file="${RUNNER_TEMP}/sbom.json"
          provenance_file="${RUNNER_TEMP}/provenance.json"

          docker buildx imagetools inspect "${image_ref}" --raw > "${index_file}"
          jq -e '
            (.manifests | type == "array") and
            ([.manifests[] | select(
              .platform.os == "linux" and
              .platform.architecture == "amd64"
            )] | length == 1) and
            ([.manifests[] | select(
              .platform.os != "unknown" and
              (
                .platform.os != "linux" or
                .platform.architecture != "amd64"
              )
            )] | length == 0)
          ' "${index_file}" >/dev/null

          if docker buildx imagetools inspect "${image_ref}" \
            --format '{{ json (index .SBOM "linux/amd64").SPDX }}' \
            > "${sbom_raw}" 2>/dev/null \
            && jq -e 'type == "object"' "${sbom_raw}" >/dev/null; then
            :
          else
            docker buildx imagetools inspect "${image_ref}" \
              --format '{{ json .SBOM.SPDX }}' > "${sbom_raw}"
          fi

          if docker buildx imagetools inspect "${image_ref}" \
            --format '{{ json (index .Provenance "linux/amd64").SLSA }}' \
            > "${provenance_raw}" 2>/dev/null \
            && jq -e 'type == "object"' "${provenance_raw}" >/dev/null; then
            :
          else
            docker buildx imagetools inspect "${image_ref}" \
              --format '{{ json .Provenance.SLSA }}' > "${provenance_raw}"
          fi

          jq -ceS \
            'select(
              type == "object" and
              .SPDXID == "SPDXRef-DOCUMENT" and
              (.spdxVersion | startswith("SPDX-"))
            )' "${sbom_raw}" > "${sbom_file}"
          jq -ceS \
            '
              def buildkit_type:
                . == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md" or
                startswith("https://mobyproject.org/buildkit@");
              def buildkit:
                (
                  ((.buildType? // null) | type == "string") and
                  (.buildType | buildkit_type) and
                  ((.builder? // null) | type == "object")
                ) or (
                  ((.buildDefinition? // null) | type == "object") and
                  (.buildDefinition.buildType | buildkit_type) and
                  ((.runDetails? // {} | .builder? // null) | type == "object")
                );
              select(
                type == "object" and
                (buildkit or ((.predicate? // {}) | buildkit))
              )
            ' "${provenance_raw}" > "${provenance_file}"

          python3 scripts/worker_release.py verify-build-manifest \
            --manifest "${RUNNER_TEMP}/source-build/${BUILD_MANIFEST_NAME}" \
            --expected-digest "${IMAGE_DIGEST}" \
            --sbom "${sbom_file}" \
            --provenance "${provenance_file}"

          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

  open_pr:
    name: Validate release branch and open PR
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out main for the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download verified build manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/source-build
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Create and locally validate release record
        id: release
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          DOCKERFILE_SHA256: ${{ needs.verify.outputs.dockerfile_sha256 }}
          SERVICE_TREE: ${{ needs.verify.outputs.service_tree }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
          SOURCE_RUN_ATTEMPT: ${{ needs.verify.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          manifest="${RUNNER_TEMP}/source-build/${BUILD_MANIFEST_NAME}"
          python3 scripts/worker_release.py verify-build-manifest \
            --manifest "${manifest}" \
            --expected-digest "${IMAGE_DIGEST}" \
            --expected-source-commit "${SOURCE_COMMIT}" \
            --expected-run-id "${SOURCE_RUN_ID}" \
            --expected-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-service-tree "${SERVICE_TREE}" \
            --expected-dockerfile-sha256 "${DOCKERFILE_SHA256}"
          python3 scripts/worker_release.py write-release \
            --manifest "${manifest}" \
            --output "${RELEASE_FILE}" \
            --expected-digest "${IMAGE_DIGEST}"
          python3 scripts/worker_release.py verify-release \
            --release "${RELEASE_FILE}"
          python3 -m unittest discover -s scripts/tests -v
          terraform fmt -check -recursive

          export TF_DATA_DIR="${RUNNER_TEMP}/terraform-lab-release"
          terraform -chdir=environments/lab init -backend=false -input=false
          terraform -chdir=environments/lab validate -no-color
          terraform -chdir=environments/lab test -no-color

          digest_hex="${IMAGE_DIGEST#sha256:}"
          release_branch="promote/worker-${digest_hex}"
          if git ls-remote --exit-code --heads origin \
            "refs/heads/${release_branch}" >/dev/null 2>&1; then
            echo "::error::Release branch ${release_branch} already exists."
            exit 1
          else
            status="$?"
            if [[ "${status}" != "2" ]]; then
              echo "::error::Could not verify that the release branch is absent."
              exit "${status}"
            fi
          fi

          git add -- "${RELEASE_FILE}"
          if [[ "$(git diff --cached --name-only)" != "${RELEASE_FILE}" ]]; then
            echo "::error::Promotion must change only ${RELEASE_FILE}."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::error::The requested digest is already the current release."
            exit 1
          fi

          echo "release_branch=${release_branch}" >> "${GITHUB_OUTPUT}"

      - name: Push isolated release branch
        id: push
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          git commit -m "chore(release): promote worker ${IMAGE_DIGEST}"
          release_commit="$(git rev-parse HEAD)"
          git push --set-upstream origin "${RELEASE_BRANCH}"
          echo "release_commit=${release_commit}" >> "${GITHUB_OUTPUT}"

      - name: Explicitly dispatch and await branch validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          RELEASE_COMMIT: ${{ steps.push.outputs.release_commit }}
        run: |
          gh workflow run validate.yml --ref "${RELEASE_BRANCH}"

          validation_run_id=""
          for _ in {1..30}; do
            validation_run_id="$(
              gh run list \
                --workflow validate.yml \
                --branch "${RELEASE_BRANCH}" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha \
                | jq -r \
                  --arg commit "${RELEASE_COMMIT}" \
                  'map(select(.headSha == $commit)) | first | .databaseId // empty'
            )"
            if [[ -n "${validation_run_id}" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "${validation_run_id}" ]]; then
            echo "::error::Could not locate explicit release-branch validation."
            exit 1
          fi
          gh run watch "${validation_run_id}" --exit-status

      - name: Open machine-generated release PR
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIGEST: ${{ needs.verify.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_REF: ${{ needs.verify.outputs.image_ref }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
          SOURCE_RUN_ATTEMPT: ${{ needs.verify.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          body_file="${RUNNER_TEMP}/release-pr.md"
          {
            echo "## Immutable worker promotion"
            echo
            echo "This changes only \`${RELEASE_FILE}\`; the image was not rebuilt."
            echo
            echo "- Source build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}"
            echo "- Source commit: \`${SOURCE_COMMIT}\`"
            echo "- Image digest: \`${IMAGE_DIGEST}\`"
            echo "- Image reference: \`${IMAGE_REF}\`"
            echo "- Build manifest artifact: \`${ARTIFACT_NAME}\`"
            echo "- GitHub artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Evidence: digest-bound BuildKit SPDX SBOM and SLSA provenance verified in Artifact Registry"
            echo
            echo "The workflow explicitly dispatched validation for this branch before opening the PR."
            echo "Merge does not deploy; use the existing saved-plan/exact-apply path."
          } > "${body_file}"

          gh pr create \
            --base main \
            --head "${RELEASE_BRANCH}" \
            --title "chore(release): promote synthetic worker ${IMAGE_DIGEST}" \
            --body-file "${body_file}"
